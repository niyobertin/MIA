name: Migrate backend schema

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - '.github/workflows/migrate-backend.yml'
  workflow_dispatch:

jobs:
  migrate:
    name: Sync PostgreSQL schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeORM schema sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TYPEORM_SYNC: 'true'
          TYPEORM_LOGGING: 'false'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL GitHub secret — skipping CI migrate."
            echo "Schema still syncs automatically when the API starts (TYPEORM_SYNC != false)."
            exit 0
          fi
          npm run db:migrate
